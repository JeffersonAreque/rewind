[project]
name = "rewind"
version = "0.1.0"
description = "Modernize legacy software from a screen recording, no source code needed."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jefferson Areque" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "modal>=1.6.3",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
]
